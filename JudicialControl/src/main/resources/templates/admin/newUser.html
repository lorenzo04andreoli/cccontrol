<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Novo Usuário</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="Container">
    <div class="divForm">
        <h1>Cadastrar Novo Usuário</h1>

        <form th:action="@{/admin/users}" method="post" th:object="${userDto}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" th:field="*{nome}" placeholder="Nome completo">
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="erro"></span>

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" th:field="*{cpf}" placeholder="CPF">
            <span th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}" class="erro"></span>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" th:field="*{senha}" placeholder="Senha (mínimo 12 caracteres)">
            <span th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}" class="erro"></span>

            <label for="confirmPassword">Confirmar Senha</label>
            <input type="password" id="confirmPassword" name="confirmPassword"
                   th:field="*{confirmPassword}" placeholder="Confirmar Senha">
            <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="erro"></span>

            <button type="submit"><i class="fas fa-user-plus"></i> Cadastrar</button>

            <p><a href="/">← Voltar ao Dashboard</a></p>
        </form>
    </div>
</div>

</body>
</html>
