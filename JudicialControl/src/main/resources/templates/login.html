<!doctype html>
<html lang="pt-br" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="/images/cc-logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/auth.css">

    <title>Login • Conselho</title>
</head>

<body class="auth">
<div class="bg" aria-hidden="true"></div>

<!-- ALERTAS  -->
<div class="alerts" role="status" aria-live="polite">
    <div th:if="${param.error}" class="alert alert-danger">
        Usuário ou senha inválidos.
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
        Você saiu do sistema.
    </div>

    <div th:if="${param.expired}" class="alert alert-warning">
        ️ Sua sessão foi encerrada porque sua conta foi acessada em outro dispositivo.
    </div>

    <div th:if="${param.invalid}" class="alert alert-warning">
        Sua sessão expirou. Faça login novamente.
    </div>

    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
</div>

<main class="layout">
    <section class="card" role="region" aria-label="Acesso ao sistema">
        <header class="brand">
            <img class="brandLogoTop" src="/images/cc-logo.png" alt="Logo do Conselho">

            <div class="brandText">
                <h1>Acesso ao Sistema</h1>
                <p>Entre com seu CPF e senha para continuar.</p>
            </div>
        </header>

        <form class="form" th:action="@{/logar}" method="post" autocomplete="on">
            <div class="field">
                <label for="cpf">CPF</label>
                <div class="inputWrap">
                    <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            inputmode="numeric"
                            autocomplete="username"
                            placeholder="Digite seu CPF"
                            maxlength="14"
                            required
                    />
                </div>
            </div>

            <div class="field">
                <label for="senha">Senha</label>
                <div class="inputWrap inputWrap--password">
                    <input
                            type="password"
                            id="senha"
                            name="senha"
                            autocomplete="current-password"
                            placeholder="Digite sua senha"
                            required
                    />

                    <button class="iconBtn" type="button" id="togglePass" aria-label="Mostrar ou ocultar senha">
                        <!-- Olho aberto -->
                        <svg class="icon icon-eye-open" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"
                                  fill="none" stroke="currentColor" stroke-width="1.8"
                                  stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"
                                  fill="none" stroke="currentColor" stroke-width="1.8"
                                  stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>

                        <!-- Olho fechado -->
                        <svg class="icon icon-eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 3l18 18"
                                  fill="none" stroke="currentColor" stroke-width="1.8"
                                  stroke-linecap="round"/>
                            <path d="M2 12s3.5-7 10-7a9.6 9.6 0 0 1 5.3 1.6M22 12s-3.5 7-10 7a9.6 9.6 0 0 1-5.3-1.6"
                                  fill="none" stroke="currentColor" stroke-width="1.8"
                                  stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- CSRF (mantido) -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <button class="btn" type="submit">
                <span>Entrar</span>
            </button>

            <footer class="footer">
                <p>Ambiente seguro • Conselho</p>
                <p class="dev">
                    &#169; Desenvolvido por Eternize
                    <img src="/images/ETERNIZE-LOGO-2.png" alt="Logo Eternize">
                </p>
            </footer>
        </form>
    </section>
</main>
<script src="/js/csrf.js"></script>
<script src="/js/auth.js"></script>

</body>
</html>
