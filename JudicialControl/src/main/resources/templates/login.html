<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <title>Tela de Login</title>
</head>
<body>

<div class="Container">
    <div class="divForm">
        <h1>Login</h1>

        <div th:if="${param.error}" class="alert alert-danger">
            Usuário ou senha inválidos.
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            Você saiu do sistema.
        </div>

        <div th:if="${param.expired}" class="alert alert-warning">
            ⚠️ Sua sessão foi encerrada porque sua conta foi acessada em outro dispositivo.
        </div>

        <div th:if="${param.invalid}" class="alert alert-warning">
            ⚠️ Sua sessão expirou. Faça login novamente.
        </div>

        <form th:action="@{/logar}" method="post">
            <label>CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="CPF" required>

            <label for="senha">Senha</label>
            <input type="password" name="senha" id="senha" required>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <button type="submit">Entrar</button>

            <div th:if="${erro != null}" th:text="${erro}" class="alert alert-danger" role="alert"></div>
            <div th:if="${msg}" class="alert alert-warning" th:text="${msg}"></div>
        </form>

    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
